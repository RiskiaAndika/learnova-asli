<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Penukaran • Learnova</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/platform.css">
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/rewards.js" defer></script>
  </head>
  <body data-role="peserta" data-page="penukaran" data-title="Penukaran">
    <div id="pageContent">
      <div class="balance-card">
        <small>Total poin reward yang tersedia</small>
        <strong id="rewardBalance">0</strong>
        <span>Gunakan poinmu untuk menukarkan voucher diskon seminar.</span>
      </div>

      <div class="platform-intro">
        <div>
          <h2>Voucher tersedia</h2>
          <p>Pilih voucher yang ingin kamu tukarkan.</p>
        </div>
      </div>

      <div class="platform-grid" id="rewardList">
        <article class="card platform-empty">Memuat voucher...</article>
      </div>

      <div class="card platform-form" style="margin-top:24px">
        <h2>Riwayat penukaran</h2>
        <div id="rewardHistory">Belum ada penukaran.</div>
      </div>
    </div>
  </body>
</html>
